<div class="tabs-wrapper">
  <button class="arrow-button arrow-left" aria-label="Anterior">
    <i class="fas fa-chevron-left"></i>
  </button>
  <div class="tabs-container" id="tabs-container"></div>
  <button class="arrow-button arrow-right" aria-label="Siguiente">
    <i class="fas fa-chevron-right"></i>
  </button>
</div>
<div class="content-container" id="content-container"></div>
<style>
  .tabs-wrapper {
    position: relative;
    width: 100%;
    margin: 40px auto 40px auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arrow-button {
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 18px 14px;
    font-size: 2rem;
    cursor: pointer;
    border-radius: 8px;
    position: absolute;
    top: 50%;
    z-index: 10;
    transform: translateY(-50%);
    transition: background 0.2s;
  }
  .arrow-left {
    left: 0;
  }
  .arrow-right {
    right: 0;
  }

  .tabs-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0;
    position: relative;
    perspective: 900px;
  }

  .tab {
    /* width: 180px; */
    height: 200px;
    margin: 0 10px;
    transition: transform 0.4s cubic-bezier(0.4, 2, 0.3, 1), box-shadow 0.4s,
      opacity 0.3s;
    opacity: 0.6;
    cursor: pointer;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }

  .tab img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    pointer-events: none;
    user-select: none;
    transition: filter 0.2s;
    filter: brightness(0.97);
  }

  .tab .tab-title {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    color: #222;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.74);
    padding: 6px 0;
    font-size: 1rem;
    border-radius: 0 0 12px 12px;
    text-align: center;
    box-shadow: 0 4px 8px -10px #000;
    pointer-events: none;
    user-select: none;
  }

  .tab.center {
    z-index: 4;
    transform: scale(1.16) rotateY(0deg);
    opacity: 1;
    box-shadow: 0 8px 24px -4px #3336;
  }
  .tab.left {
    z-index: 2;
    opacity: 0.85;
    transform: scale(0.93) rotateY(15deg) translateX(-10px);
    box-shadow: 0 2px 12px -2px #aaa6;
  }
  .tab.right {
    z-index: 2;
    opacity: 0.85;
    transform: scale(0.93) rotateY(-15deg) translateX(10px);
    box-shadow: 0 2px 12px -2px #aaa6;
  }

  @media (max-width: 700px) {
    .tabs-wrapper {
      max-width: 98vw;
    }
    .tabs-container {
      max-width: 98vw;
    }
    .tab {
      width: 27vw;
      height: 23vw;
      min-width: 85px;
      min-height: 75px;
    }
    .arrow-button {
      font-size: 1.3rem;
      padding: 9px 3px;
    }
    .tab .tab-title {
      font-size: 0.88rem;
    }
  }

  .content-container {
    padding: 18px;
    min-height: 70px;
    margin-top: 12px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 10px;
    animation: fadeUp 1s ease-in-out;
  }
  @keyframes fadeUp {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
<script>
  const tabsData = [
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/1-e1732638280330.png",
      title: "Patolsima",
      content: `[SHORTCODE_ELEMENTOR id="1165"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-26_130604727.png",
      title: "Green & Clean",
      content: `[SHORTCODE_ELEMENTOR id="497"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_082408868-e1732710310835.png",
      title: "Organización Tanabe",
      content: `[SHORTCODE_ELEMENTOR id="507"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_083233055-e1732710855728.png",
      title: "Villa Manolo",
      content: `[SHORTCODE_ELEMENTOR id="520"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_084005190.png",
      title: "Dojo Hinomaru",
      content: `[SHORTCODE_ELEMENTOR id="529"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_084629699-e1732711645792.png",
      title: "Oasis Uvita",
      content: `[SHORTCODE_ELEMENTOR id="540"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_085344234-e1732712097986.png",
      title: "Koru",
      content: `[SHORTCODE_ELEMENTOR id="556"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/imagen_2024-11-27_090717014-e1732712918901.png",
      title: "Osa Magic",
      content: `[SHORTCODE_ELEMENTOR id="573"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2024/11/Screenshot-2024-11-27-160415-e1732738557306.png",
      title: "Gitanas Corcovado Tours",
      content: `[SHORTCODE_ELEMENTOR id="826"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2025/06/Group-56-1-scaled-e1750448710997.jpg",
      title: "Japi Travels",
      content: `[SHORTCODE_ELEMENTOR id="2017"]`,
    },
    {
      src: "https://detipcompany.com/wp-content/uploads/2025/06/Group-57-1-scaled-e1750449212362.jpg",
      title: "Citronella",
      content: `[SHORTCODE_ELEMENTOR id="2028"]`,
    },
  ];
  let centerIdx = 0;

  function renderTabs() {
    const container = document.getElementById("tabs-container");
    container.innerHTML = "";

    // Calcula los índices circularmente
    const leftIdx = (centerIdx - 1 + tabsData.length) % tabsData.length;
    const rightIdx = (centerIdx + 1) % tabsData.length;

    // Tabs a mostrar
    const toShow = [
      { idx: leftIdx, pos: "left" },
      { idx: centerIdx, pos: "center" },
      { idx: rightIdx, pos: "right" },
    ];

    toShow.forEach(({ idx, pos }) => {
      const t = tabsData[idx];
      const div = document.createElement("div");
      div.className = "tab " + pos;
      div.innerHTML = `<img src="${t.src}" alt="${t.title}"><div class="tab-title">${t.title}</div>`;
      // Click: el central no hace nada, los otros mueven el carrusel
      div.onclick = () => {
        if (pos === "left") {
          centerIdx = leftIdx;
          renderTabs();
          renderContent();
        } else if (pos === "right") {
          centerIdx = rightIdx;
          renderTabs();
          renderContent();
        }
      };
      container.appendChild(div);
    });
  }

  function renderContent() {
    const content = document.getElementById("content-container");
    content.innerHTML = `<p>${tabsData[centerIdx].content}</p>`;
    content.style.animation = "none";
    setTimeout(() => {
      content.style.animation = "fadeUp 1s ease-in-out";
    }, 10);
  }

  document.querySelector(".arrow-left").onclick = function () {
    centerIdx = (centerIdx - 1 + tabsData.length) % tabsData.length;
    renderTabs();
    renderContent();
  };
  document.querySelector(".arrow-right").onclick = function () {
    centerIdx = (centerIdx + 1) % tabsData.length;
    renderTabs();
    renderContent();
  };

  renderTabs();
  renderContent();
</script>
