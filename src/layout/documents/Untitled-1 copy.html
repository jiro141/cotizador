<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeTask - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white py-4 px-6 shadow-md flex justify-between items-center">
    <h1 class="text-2xl font-bold">🏠 HomeTask</h1>
    <p class="text-sm opacity-80">Tablero de gestión de tareas</p>
  </header>

  <!-- Tablero -->
  <main class="grid grid-cols-4 gap-4 p-4 flex-1">

    <!-- Panel Izquierdo: Formulario -->
    <section class="bg-gray-800 p-4 rounded-xl shadow-md col-span-1">
      <h2 class="text-lg font-semibold mb-3">➕ Nueva Tarea</h2>
      <form id="taskForm" class="flex flex-col gap-2 text-sm">
        <input type="text" id="taskName" placeholder="Nombre de la tarea"
          class="p-2 border border-gray-600 bg-gray-700 rounded-md w-full text-sm text-white" required>
        
        <select id="taskType" class="p-2 border border-gray-600 bg-gray-700 rounded-md w-full text-white">
          <option value="Limpieza">Limpieza</option>
          <option value="Cocina">Cocina</option>
          <option value="Exterior">Exterior</option>
          <option value="Otros">Otros</option>
        </select>

        <select id="urgency" class="p-2 border border-gray-600 bg-gray-700 rounded-md w-full text-white">
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>

        <select id="assignedTo" class="p-2 border border-gray-600 bg-gray-700 rounded-md w-full text-white">
          <option value="Ana">Ana</option>
          <option value="Luis">Luis</option>
          <option value="Marta">Marta</option>
          <option value="Pedro">Pedro</option>
        </select>

        <button type="submit"
          class="bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-500 transition">
          Agregar
        </button>
      </form>
    </section>

    <!-- Columna Central: Lista de Tareas -->
    <section class="bg-gray-800 p-4 rounded-xl shadow-md col-span-2">
      <h2 class="text-lg font-semibold mb-3">📋 Tareas</h2>
      <div id="taskColumns" class="grid grid-cols-2 gap-4">
        <!-- Las columnas de tareas se generarán dinámicamente -->
      </div>
    </section>

    <!-- Panel Derecho: Ranking -->
    <section class="bg-gray-800 p-4 rounded-xl shadow-md col-span-1">
      <h2 class="text-lg font-semibold mb-3">🏆 Ranking</h2>
      <div id="ranking" class="space-y-3 text-sm"></div>
    </section>

  </main>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskColumns = document.getElementById("taskColumns");
    const rankingDiv = document.getElementById("ranking");

    let tasks = [];
    let scores = { Ana: 0, Luis: 0, Marta: 0, Pedro: 0 };

    const colorsByType = {
      Limpieza: "bg-blue-500",
      Cocina: "bg-green-500",
      Exterior: "bg-yellow-500",
      Otros: "bg-purple-500"
    };

    const urgencyColors = {
      Alta: "bg-red-600 text-white",
      Media: "bg-orange-500 text-white",
      Baja: "bg-gray-400 text-black"
    };

    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const taskName = document.getElementById("taskName").value;
      const taskType = document.getElementById("taskType").value;
      const urgency = document.getElementById("urgency").value;
      const assignedTo = document.getElementById("assignedTo").value;

      const task = { 
        id: Date.now(), 
        name: taskName, 
        type: taskType, 
        urgency, 
        assignedTo, 
        done: false 
      };

      tasks.push(task);
      renderTasks();
      taskForm.reset();
    });

    function renderTasks() {
      taskColumns.innerHTML = "";
      const grouped = { Limpieza: [], Cocina: [], Exterior: [], Otros: [] };

      tasks.forEach(task => grouped[task.type].push(task));

      Object.keys(grouped).forEach(type => {
        const col = document.createElement("div");
        col.innerHTML = `<h3 class="font-semibold mb-2">${type}</h3>`;
        grouped[type].forEach(task => {
          const card = document.createElement("div");
          card.className = `p-3 rounded-lg shadow-md mb-2 ${colorsByType[type]} bg-opacity-90 text-sm`;
          card.innerHTML = `
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold">${task.name}</span>
              <span class="px-2 py-1 rounded text-xs ${urgencyColors[task.urgency]}">${task.urgency}</span>
            </div>
            <p class="text-xs">Asignada a: <b>${task.assignedTo}</b></p>
            <button onclick="toggleTask(${task.id})" 
              class="mt-2 px-2 py-1 rounded-md text-xs ${task.done ? 'bg-green-800' : 'bg-red-800'} text-white">
              ${task.done ? 'Hecha' : 'No hecha'}
            </button>
          `;
          col.appendChild(card);
        });
        taskColumns.appendChild(col);
      });
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          task.done = !task.done;
          if (task.done) scores[task.assignedTo] += 10;
          else scores[task.assignedTo] -= 10;
        }
        return task;
      });
      renderTasks();
      renderRanking();
    }

    function renderRanking() {
      rankingDiv.innerHTML = "";
      Object.entries(scores)
        .sort((a, b) => b[1] - a[1])
        .forEach(([name, points]) => {
          const div = document.createElement("div");
          div.className = "flex items-center";
          div.innerHTML = `
            <span class="w-20">${name}</span>
            <div class="bg-gray-600 w-full h-3 rounded-full mx-2">
              <div class="bg-indigo-500 h-3 rounded-full" style="width:${points}px"></div>
            </div>
            <span class="ml-2 font-semibold">${points}</span>
          `;
          rankingDiv.appendChild(div);
        });
    }

    renderRanking();
  </script>
</body>
</html>
